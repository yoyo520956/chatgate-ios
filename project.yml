name: ChatGate
options:
  bundleIdPrefix: com.qingyao
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "20261024.27"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: "NO"
targets:
  ChatGate:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingyao.chatgate
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "20261024.27"
        INFOPLIST_FILE: Resources/Info.plist
        ENABLE_BITCODE: "NO"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
